# BACKGROUND
background {
    monitor =
    path = /home/cviper13/Pictures/Wallpapers/creation-of-adam-ascii.jpg
    blur_passes = 2
    contrast = 1
    brightness = 0.5
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# GENERAL
general {
    no_fade_in = true
    no_fade_out = true
    hide_cursor = false
    grace = 0
    disable_loading_bar = true
}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0.2)
    font_color = rgba(255, 255, 255, 1) # base07
    fade_on_empty = false
    rounding = -1
    check_color = rgb(204, 136, 34)
    placeholder_text = <i><span foreground="##ffffff">Input Password...</span></i>
    hide_input = false
    position = 0, -200
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(255, 255, 255, 0.75) # base07 but with transparency
    font_size = 22
    font_family = JetBrains Mono
    position = 0, 300
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%-I:%M")"
    color = rgba(255, 255, 255, 0.75) # base07 but with transparency
    font_size = 95
    font_family = JetBrains Mono Extrabold
    position = 0, 200
    halign = center
    valign = center
}

# PROFILE PICTURE
image {
    monitor =
    path = /home/justin/Pictures/profile_pictures/justin_square.png
    size = 100
    border_size = 2
    border_color = rgba(255, 255, 255, 1) # base07
    position = 0, -100
    halign = center
    valign = center
}

# PALETTE (REFERENCE ONLY, NOT USED DIRECTLY IN CONFIG)
# base00: #000000 -> rgba(0, 0, 0, 1)
# base01: #111111 -> rgba(17, 17, 17, 1)
# base02: #222222 -> rgba(34, 34, 34, 1)
# base03: #333333 -> rgba(51, 51, 51, 1)
# base04: #888888 -> rgba(136, 136, 136, 1)
# base05: #aaaaaa -> rgba(170, 170, 170, 1)
# base06: #cccccc -> rgba(204, 204, 204, 1)
# base07: #ffffff -> rgba(255, 255, 255, 1)
