# Hyprland Colors Configuration
# Source colors from pywal cache
source = $HOME/.cache/wal/colors-hyprland.conf

# Border colors using wal variables
$col.active_border = $color1 $color2 45deg
$col.inactive_border = $color8

# Group border colors
$col.group_border = $color8
$col.group_border_active = $color1

# Window shadow color
$col.shadow = $color0

# Text colors for various elements
$col.text_active = $foreground
$col.text_inactive = $color7

# Accent colors for UI elements
$col.accent = $color1
$col.accent_secondary = $color2
$col.urgent = $color9
$col.warning = $color3
$col.success = $color10
$col.error = $color1
